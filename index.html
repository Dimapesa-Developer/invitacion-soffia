<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- fuera de los buscadores: aquí van el nombre y la foto de una menor -->
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis XV años · Soffia Crystina</title>
<meta name="description" content="Invitación a los XV años de Soffia Crystina Molina González.">
<meta name="theme-color" content="#F7EADF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@300;400;500&family=Parisienne&display=swap">
<!-- El estilo se decide antes de pintar nada: si se pusiera desde script.js
     se vería un parpadeo del estilo viejo al nuevo. Manda ?estilo= de la URL;
     si no, lo que diga datos.js (y por defecto, «papel»). -->
<script src="datos.js?v=1794944188"></script>
<script>
  (function () {
    var p = new URLSearchParams(location.search).get('estilo');
    var e = (p === 'fiesta' || p === 'papel') ? p : null;
    var d = (window.DATOS && DATOS.estilo) || 'papel';
    document.documentElement.dataset.estilo = e || d;
    if (e) try { sessionStorage.setItem('estilo', e); } catch (x) {}
  })();
</script>
<link rel="preload" as="image" href="assets/apertura-poster.webp">
<link rel="stylesheet" href="styles.css?v=1794944188">
</head>
<body class="sin-abrir">

<!-- ══════════════ ADORNOS ══════════════
     Dibujados, no fotografiados: así los mismos cuatro sirven a los dos
     estilos. El CSS decide color, tamaño y fuerza, de modo que en «papel»
     pasan por acuarela apagada y en «fiesta» por plata y purpurina. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
 <defs>

  <clipPath id="c-esfera"><circle cx="50" cy="52" r="40"/></clipPath>
  <symbol id="ad-esfera" viewBox="0 0 100 100">
    <radialGradient id="g-esfera" cx="34%" cy="26%" r="82%">
      <stop offset="0"   stop-color="#FFFFFF"/>
      <stop offset=".30" stop-color="var(--ad-claro,#EDE7E9)"/>
      <stop offset=".70" stop-color="var(--ad-medio,#BCB2B7)"/>
      <stop offset="1"   stop-color="var(--ad-hondo,#857A80)"/>
    </radialGradient>
    <circle cx="50" cy="52" r="40" fill="url(#g-esfera)"/>
    <g clip-path="url(#c-esfera)" stroke="#FFFFFF" stroke-opacity=".5" stroke-width=".9" fill="none">
      <!-- los meridianos van en elipses: rectos, la esfera parecería una reja -->
      <ellipse cx="50" cy="52" rx="10" ry="40"/>
      <ellipse cx="50" cy="52" rx="22" ry="40"/>
      <ellipse cx="50" cy="52" rx="32" ry="40"/>
      <path d="M10 36h80M10 44h80M10 52h80M10 60h80M10 68h80M14 28h72M14 76h72"/>
    </g>
    <ellipse cx="36" cy="35" rx="12" ry="8" fill="#FFFFFF" opacity=".5"
             transform="rotate(-26 36 35)"/>
    <path d="M50 12v-9" stroke="var(--ad-hondo,#C9BFC4)" stroke-width="1.6" stroke-linecap="round"/>
  </symbol>

  <symbol id="ad-estrella" viewBox="0 0 100 100">
    <path fill="currentColor"
          d="M50 7 61.8 38.2 95 39.4 68.6 59.6 78 91.5 50 72.4 22 91.5 31.4 59.6 5 39.4 38.2 38.2Z"/>
    <path fill="#FFFFFF" opacity=".42"
          d="M50 7 61.8 38.2 95 39.4 68.6 59.6 50 46Z"/>
  </symbol>

  <symbol id="ad-destello" viewBox="0 0 100 100">
    <path fill="currentColor"
          d="M50 2c3 26 19 42 46 48-27 6-43 22-46 48-3-26-19-42-46-48 27-6 43-22 46-48Z"/>
  </symbol>

  <symbol id="ad-mono" viewBox="0 0 100 100">
    <g fill="currentColor">
      <path d="M46 52c-6 12-12 20-20 28 7 2 12 1 16-3 5-5 8-14 9-23Z"/>
      <path d="M54 52c6 12 12 20 20 28-7 2-12 1-16-3-5-5-8-14-9-23Z"/>
      <path d="M48 48C38 36 24 30 14 34c-9 4-8 16 2 20 9 4 23 1 32-6Z"/>
      <path d="M52 48c10-12 24-18 34-14 9 4 8 16-2 20-9 4-23 1-32-6Z"/>
    </g>
    <path d="M44 42c-7-4-16-6-22-4" stroke="#FFFFFF" stroke-opacity=".45"
          stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <path d="M56 42c7-4 16-6 22-4" stroke="#FFFFFF" stroke-opacity=".45"
          stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <ellipse cx="50" cy="49" rx="6.5" ry="7.5" fill="currentColor"/>
    <ellipse cx="50" cy="49" rx="6.5" ry="7.5" fill="#000" opacity=".18"/>
    <path d="M44 42c2-2 5-3 8-3" stroke="#FFFFFF" stroke-opacity=".5"
          stroke-width="1.6" fill="none" stroke-linecap="round"/>
  </symbol>

 </defs>
</svg>

<p class="salta"><a href="#contenido">Saltar al contenido de la invitación</a></p>

<!-- ══════════════ 1 · EL SOBRE ══════════════ -->
<section class="pantalla-sobre" id="sobre">
  <div class="sobre-centro">

    <button type="button" class="escenario" id="escenario"
            aria-label="Abrir la invitación de Soffia">
     <span class="lienzo">
      <!-- 1 · el sobre cerrado, quieto, hasta que tocan -->
      <img class="capa" id="capa-poster" src="assets/apertura-poster.webp" alt=""
           width="1080" height="1920" fetchpriority="high">

      <!-- 2 · los dos vídeos, uno detrás de otro. Son dos elementos y no uno
           con la fuente cambiada: así el segundo ya está descargado y pintado
           cuando acaba el primero, y el corte no parpadea. -->
      <video class="capa" id="video-1" muted playsinline preload="auto"
             aria-hidden="true" src="assets/apertura-1.mp4"></video>
      <video class="capa" id="video-2" muted playsinline preload="none"
             aria-hidden="true"></video>

      <!-- 3 · la hoja: es el último fotograma del segundo vídeo, así que el
           relevo no se ve. Hace falta porque el navegador tira la imagen de un
           vídeo pausado al salir de pantalla y al volver dibuja la primera. -->
      <img class="capa" id="capa-final" src="assets/apertura-final.webp" alt=""
           width="1080" height="1920" fetchpriority="low">

      <!-- 3b · y la hoja se asienta: el fotograma del vídeo recorta un 18 %
           del ancho, justo donde está el borde deckle. Esta capa trae la hoja
           entera y entra creciendo hacia su tamaño real, así que el reencuadre
           se lee como el papel posándose y no como un salto. -->
      <span class="capa hoja-posada" id="hoja-posada" aria-hidden="true">
        <img src="assets/hoja.webp" alt="" width="909" height="1243"
             fetchpriority="low">
      </span>

      <!-- 4 · y encima, las letras -->
      <span class="carta" id="carta" aria-hidden="true">
        <span class="carta-cintillo" style="--i:0">Mis XV años</span>
        <span class="filete" style="--i:1"><i></i><b></b><i></i></span>
        <span class="carta-nombre" style="--i:2">Soffia Crystina</span>
        <span class="carta-apellidos" style="--i:3">Molina González</span>
        <span class="carta-fecha" id="carta-fecha" style="--i:4">Fecha por confirmar</span>
      </span>
     </span>
    </button>


    <!-- «Toca para abrir» y «Desliza» ocupan el mismo sitio: una se desvanece y
         la otra aparece justo donde estaba, pegada al sobre. -->
    <div class="pie-sobre">
    <div class="llamada" id="llamada">
      <span class="llamada-sello" aria-hidden="true"></span>
      <span class="llamada-texto">Toca para abrir</span>
    </div>

    <div class="baja" id="baja" aria-hidden="true">
      <span>Desliza</span>
      <svg viewBox="0 0 18 26" width="18" height="26" fill="none" aria-hidden="true">
        <path d="M9 1v21M3 16l6 6 6-6" stroke="currentColor" stroke-width="1.1"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      </div>
    </div>
  </div>
</section>

<main id="contenido">

<!-- ══════════════ 2 · SOFFIA ══════════════ -->
<!-- ══════════════ 2 · LA ILUSIÓN ══════════════ -->
<section class="seccion s-nota" id="nota">
  <div class="costura costura-arriba invertida" aria-hidden="true"></div>

  <div class="envoltorio">
    <p class="parrafo-grande revela" id="msj-presentacion" style="--i:0"></p>
  </div>
</section>

<!-- ══════════════ 3 · SOFFIA ══════════════ -->
<section class="seccion s-soffia" id="soffia">
  <div class="costura costura-arriba" aria-hidden="true"></div>
  <img class="flor flor-soffia" src="assets/flor-rosa.webp" alt="" loading="lazy" data-parallax="0.09">
  <span class="adorno adorno-soffia adorno-esfera" aria-hidden="true" data-parallax="0.10"><svg viewBox="0 0 100 100"><use href="#ad-esfera"/></svg></span>
  <span class="adorno adorno-soffia adorno-destello" aria-hidden="true" data-parallax="0.11"><svg viewBox="0 0 100 100"><use href="#ad-destello"/></svg></span>

  <!-- el puente: lo último que se lee antes de que se abran las rosas -->
  <div class="envoltorio">
    <p class="parrafo-puente revela" id="msj-puente" style="--i:0"></p>
  </div>

  <!-- La escena se queda clavada en pantalla mientras dura el efecto. Es lo
       que permite darle recorrido de scroll sin dejar papel en blanco: la
       fotografía no se mueve, lo que avanza es el desvelado. -->
  <div class="soffia-escena">

  <!-- la fotografía asoma por un rasgado del papel -->
  <figure class="retrato revela" id="retrato" style="--i:2">
    <div class="retrato-marco">
      <img id="foto-portada" alt="Fotografía de Soffia" hidden>
      <div class="retrato-vacio" id="retrato-vacio">
        <img src="assets/flor-hojas.webp" alt="" loading="lazy">
        <p>Aquí irá la fotografía de Soffia</p>
      </div>
      <!-- tres paneles de rosas: arriba sube, izquierda y derecha se abren -->
      <img class="velo velo-arriba" src="assets/panel-arriba.webp" alt="" loading="lazy">
      <img class="velo velo-izq" src="assets/panel-izq.webp" alt="" loading="lazy">
      <img class="velo velo-der" src="assets/panel-der.webp" alt="" loading="lazy">
    </div>
    <span class="costura costura-foto arriba" aria-hidden="true"></span>
    <span class="costura costura-foto abajo" aria-hidden="true"></span>
  </figure>

  <!-- la invitación de verdad: aparece cuando las rosas terminan de abrirse -->
  <div class="envoltorio">
    <div class="invitacion" id="invitacion">
      <p class="antetitulo inv-ep">Te invito</p>
      <h1 class="titulo-soffia inv-nom">
        <span class="firma" id="nombre-grande">Soffia Crystina</span>
      </h1>
      <p class="inv-pie"><span class="inv-pie-a">Te invito a mis</span><span class="inv-xv">XV años</span></p>
    </div>
  </div>

  </div><!-- /soffia-escena -->
</section>

<!-- ══════════════ 3 · CUÁNDO Y DÓNDE ══════════════ -->
<section class="seccion s-cuando" id="cuando">
  <div class="costura costura-arriba invertida" aria-hidden="true"></div>
  <img class="flor flor-cuando" src="assets/flor-ramo.webp" alt="" loading="lazy" data-parallax="0.07">
  <span class="adorno adorno-cuando adorno-estrella" aria-hidden="true" data-parallax="0.10"><svg viewBox="0 0 100 100"><use href="#ad-estrella"/></svg></span>
  <span class="adorno adorno-cuando adorno-destello" aria-hidden="true" data-parallax="0.11"><svg viewBox="0 0 100 100"><use href="#ad-destello"/></svg></span>

  <div class="envoltorio">
    <p class="antetitulo revela" style="--i:0">Cuándo</p>
    <h2 class="titulo revela" style="--i:1">La fecha</h2>

    <div class="fecha-grande revela" id="fecha-grande" style="--i:2"></div>

    <div class="cuenta" id="cuenta" hidden>
      <div class="cuenta-celda"><b id="cr-d">00</b><span>días</span></div>
      <div class="cuenta-celda"><b id="cr-h">00</b><span>horas</span></div>
      <div class="cuenta-celda"><b id="cr-m">00</b><span>min</span></div>
      <div class="cuenta-celda"><b id="cr-s">00</b><span>seg</span></div>
    </div>

  </div>
</section>

<!-- ══════════════ 4b · DÓNDE ══════════════ -->
<section class="seccion s-donde" id="donde">
  <div class="costura costura-arriba" aria-hidden="true"></div>

  <div class="envoltorio">
    <p class="antetitulo revela" style="--i:0">Dónde</p>
    <h2 class="titulo revela" style="--i:1">Los lugares</h2>

    <div class="sedes" id="sedes"></div>
  </div>
</section>

<!-- ══════════════ 4 · ITINERARIO ══════════════ -->
<section class="seccion s-itinerario" id="itinerario">
  <div class="costura costura-arriba" aria-hidden="true"></div>
  <img class="flor flor-itin" src="assets/flor-capullos.webp" alt="" loading="lazy" data-parallax="0.11">
  <span class="adorno adorno-itin adorno-mono" aria-hidden="true" data-parallax="0.10"><svg viewBox="0 0 100 100"><use href="#ad-mono"/></svg></span>
  <span class="adorno adorno-itin adorno-destello" aria-hidden="true" data-parallax="0.11"><svg viewBox="0 0 100 100"><use href="#ad-destello"/></svg></span>

  <div class="envoltorio">
    <p class="antetitulo revela" style="--i:0">Así celebraremos</p>
    <h2 class="titulo revela" style="--i:1">Itinerario</h2>

    <div class="linea-tiempo" id="linea-tiempo">
      <span class="linea-riel" aria-hidden="true"><i id="linea-avance"></i></span>
      <ol id="momentos"></ol>
    </div>

  </div>
</section>

<!-- ══════════════ 5 · VESTIMENTA ══════════════ -->
<section class="seccion s-vestir" id="vestir" hidden>
  <div class="costura costura-arriba invertida" aria-hidden="true"></div>

  <div class="envoltorio">
    <div class="vestimenta" id="vestimenta" hidden></div>
  </div>
</section>

<!-- ══════════════ 6 · CONFIRMACIÓN ══════════════ -->
<section class="seccion s-confirmar" id="confirmar">
  <div class="costura costura-arriba" aria-hidden="true"></div>

  <div class="envoltorio">
    <p class="antetitulo revela" style="--i:0">Nos vemos en mis XV</p>
    <p class="parrafo-grande revela" id="msj-cierre" style="--i:1"></p>
    <div class="accion revela" id="accion" style="--i:2"></div>
  </div>
</section>

<!-- ══════════════ 7 · DESPEDIDA ══════════════ -->
<section class="seccion s-cierre" id="cierre">
  <div class="costura costura-arriba invertida" aria-hidden="true"></div>
  <!-- el cierre se monta en tres piezas: la rosa donde aterriza la que cae,
       y el follaje de cada lado, que sale de detrás cuando ya está posada -->
  <span class="flor flor-cierre-b" aria-hidden="true" data-parallax="0.09">
    <img class="cierre-hoja cierre-izq" src="assets/flor-bajo-izq.webp" alt="" loading="lazy">
    <img class="cierre-hoja cierre-der" src="assets/flor-bajo-der.webp" alt="" loading="lazy">
    <img class="cierre-rosa" src="assets/flor-bajo-rosa.webp" alt="" loading="lazy">
  </span>

  <div class="envoltorio">
    <!-- la firma, sellada en lacre, como en la papelería impresa -->
    <div class="rubrica revela" style="--i:0">
      <span class="filete"><i></i><b></b><i></i></span>
      <span class="rubrica-eti">Con cariño</span>
      <span class="firma rubrica-firma">Soffia</span>
      <p class="rubrica-pie" id="rubrica-pie"></p>
    </div>
  </div>
</section>

</main>

<!-- la rosa que se desprende de la tarjeta y baja con el scroll -->
<span class="petalo" id="petalo" aria-hidden="true">
  <img class="petalo-cara" id="rosa-frente" src="assets/rosa-frente.webp" alt="">
  <img class="petalo-cara" id="rosa-tres"   src="assets/rosa-tres.webp"   alt="">
  <img class="petalo-cara" id="rosa-perfil" src="assets/rosa-perfil.webp" alt="">
</span>

<button type="button" class="audio" id="audio" hidden aria-pressed="false"
        aria-label="Activar la música">
  <span class="audio-ondas" aria-hidden="true"><i></i><i></i><i></i></span>
</button>

<div class="aviso-previa" id="aviso-previa" hidden>
  Vista previa
</div>

<script src="script.js?v=1794944188"></script>
</body>
</html>
